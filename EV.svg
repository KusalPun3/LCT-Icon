<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Charger Body -->
  <rect x="18" y="10"
        width="22"
        height="36"
        rx="3"
        fill="#0078D4"/>

  <!-- Screen -->
  <rect x="23" y="15"
        width="12"
        height="8"
        fill="white"/>

  <!-- Lightning Bolt -->
  <polygon
    points="30,26 25,35 29,35 26,42 35,31 31,31 34,26"
    fill="#FFD700"/>

  <!-- Charging Cable -->
  <path
    d="M40 20 C50 20, 50 30, 50 35 L50 45"
    fill="none"
    stroke="#0078D4"
    stroke-width="3"/>

  <!-- Plug -->
  <line x1="48" y1="45" x2="48" y2="50"
        stroke="#0078D4"
        stroke-width="2"/>

  <line x1="52" y1="45" x2="52" y2="50"
        stroke="#0078D4"
        stroke-width="2"/>

</svg>